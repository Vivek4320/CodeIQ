<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#cccccc"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Left bracket < -->
  <text x="140" y="320" font-family="monospace" font-size="220" font-weight="700" fill="url(#accent)" text-anchor="middle">&lt;</text>
  <!-- Right bracket > -->
  <text x="372" y="320" font-family="monospace" font-size="220" font-weight="700" fill="url(#accent)" text-anchor="middle">&gt;</text>
  <!-- Slash / in middle -->
  <text x="256" y="310" font-family="monospace" font-size="140" font-weight="300" fill="#666666" text-anchor="middle">/</text>
  <!-- Subtle glow -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
</svg>
